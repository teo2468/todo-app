                  <div>
                    <TimeInput value={settingsNotify2Time} onChange={setSettingsNotify2Time} />
                    <WeekdayChips days={settingsNotify2Days} onChange={setSettingsNotify2Days} />
                  </div>
                )}
              </div>

              <div style={{ padding: "12px 16px", backgroundColor: "var(--bg-badge)", borderRadius: 12, marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <span style={{ fontSize: 14, fontWeight: 600, color: "var(--text-primary)" }}>タスク0件の日は送らない</span>
                <button onClick={() => setSettingsSkipEmpty(v => !v)} style={{
                  width: 52, height: 30, borderRadius: 15, border: "none", cursor: "pointer",
                  backgroundColor: settingsSkipEmpty ? "var(--toggle-on)" : "var(--bg-checkbox)", position: "relative",
                }}>
                  <div style={{ width: 24, height: 24, borderRadius: 12, backgroundColor: "#fff", position: "absolute", top: 3, left: settingsSkipEmpty ? 25 : 3, transition: "left 0.2s", boxShadow: "0 1px 4px rgba(0,0,0,0.2)" }} />
                </button>
              </div>

              <button
                onClick={handleSaveNotifySettings}
                style={{
                  width: "100%", padding: "10px", borderRadius: 10, border: "none", cursor: "pointer",
                  backgroundColor: ACCENT, color: "var(--accent-text)",
                  fontSize: 13, fontWeight: 700, fontFamily: "inherit",
                }}
              >保存</button>
              {settingsSaved && (
                <p style={{ fontSize: 12, color: "var(--success)", margin: "8px 0 0", fontWeight: 600, textAlign: "center" }}>✓ 保存しました</p>
              )}
              <p style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "8px 0 0", lineHeight: 1.6 }}>
                時刻・曜日・0件スキップは「保存」を押すと反映されます。
                まとめに含める内容はすぐ下の「定時まとめの内容」で変更できます。
                タスク個別のリマインドは各タスクの編集画面「Discord通知」で、カウントダウンの通知は各カウントダウンの✏️（編集）から設定します。
              </p>
            </div>
          )}

          {USER_ID && (() => {
            const enabled = (appData.settings && appData.settings.notifyCategories) || DEFAULT_NOTIFY_CATEGORIES;
            const minPri = (appData.settings && appData.settings.notifyMinPriority) || "all";
            const updateCats = (newEnabled) => {
              const newData = { ...appData, settings: { ...(appData.settings || {}), notifyCategories: newEnabled } };
              updateData(newData); syncNow(newData);
            };
            const updateMinPri = (v) => {
              const newData = { ...appData, settings: { ...(appData.settings || {}), notifyMinPriority: v } };
              updateData(newData); syncNow(newData);
            };
            const resetDefaults = () => {
              const newData = { ...appData, settings: { ...(appData.settings || {}), notifyCategories: DEFAULT_NOTIFY_CATEGORIES, notifyMinPriority: "all" } };
              updateData(newData); syncNow(newData);
            };
            return (
              <div style={{ marginTop: 4, paddingTop: 16, borderTop: "1px solid var(--border)" }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: "var(--text-tertiary)", marginBottom: 10, letterSpacing: "0.06em" }}>
                  定時まとめの内容
                </div>
                <p style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "0 0 10px", lineHeight: 1.5 }}>
                  含めるカテゴリ（順序は固定）。
                </p>
                <div style={{ padding: "10px 12px", backgroundColor: "var(--bg-badge)", borderRadius: 12, display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
                  {NOTIFY_CATEGORIES.map(c => {
                    const on = enabled.indexOf(c.key) !== -1;
                    return (
                      <div key={c.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 6px" }}>
                        <span style={{ fontSize: 13, color: "var(--text-primary)" }}>{c.icon} {c.label}</span>
                        <button onClick={() => {
                          const next = on ? enabled.filter(k => k !== c.key) : DEFAULT_NOTIFY_CATEGORIES.filter(k => enabled.indexOf(k) !== -1 || k === c.key);
                          updateCats(next);
                        }} style={{
                          width: 44, height: 26, borderRadius: 13, border: "none", cursor: "pointer",
                          backgroundColor: on ? "var(--toggle-on)" : "var(--bg-checkbox)", position: "relative",
                        }}>
                          <div style={{ width: 20, height: 20, borderRadius: 10, backgroundColor: "#fff", position: "absolute", top: 3, left: on ? 21 : 3, transition: "left 0.2s", boxShadow: "0 1px 4px rgba(0,0,0,0.2)" }} />
                        </button>
                      </div>
                    );
                  })}
                </div>

                <div style={{ fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 6 }}>最低優先度</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, marginBottom: 12 }}>
                  {MIN_PRIORITY_OPTIONS.map(p => {
                    const sel = minPri === p.key;
                    return (
                      <button key={p.key} onClick={() => updateMinPri(p.key)} style={{
                        padding: "9px", borderRadius: 10, border: "none", cursor: "pointer",
                        backgroundColor: sel ? ACCENT : "var(--bg-badge)",
                        color: sel ? "var(--accent-text)" : "var(--text-secondary)",
                        fontSize: 13, fontWeight: 600, fontFamily: "inherit",
                      }}>{p.label}</button>
                    );
                  })}
                </div>

                <button onClick={resetDefaults} style={{
                  width: "100%", padding: "10px", borderRadius: 10, border: "1px solid var(--border)",
                  cursor: "pointer", backgroundColor: "var(--bg-card)",
                  color: "var(--text-secondary)", fontSize: 12, fontWeight: 600, fontFamily: "inherit",
                }}>デフォルトに戻す</button>
                <p style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "8px 0 0", lineHeight: 1.5 }}>
                  特定タブを除外したい場合は、タブ編集モーダルの「定時通知に含める」をオフに。
                </p>
              </div>
            );
          })()}

          {USER_ID && (() => {
            const s = appData.settings || {};
            const setS = (patch) => {
              const newData = { ...appData, settings: { ...s, ...patch } };
              updateData(newData);
              syncNow(newData);
            };
            return (
              <div style={{ marginTop: 4, paddingTop: 16, borderTop: "1px solid var(--border)" }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: "var(--text-tertiary)", marginBottom: 10, letterSpacing: "0.06em" }}>
                  個別リマインドの既定
                </div>
                <div style={{ padding: "12px 16px", backgroundColor: "var(--bg-badge)", borderRadius: 12, marginBottom: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, marginBottom: 8 }}>
                    <span style={{ fontSize: 14, fontWeight: 600, color: "var(--text-primary)" }}>基準時刻</span>
                    <div style={{ width: 110 }}>
                      <TimeInput value={s.defaultNotifyTime || "09:00"} onChange={(v) => setS({ defaultNotifyTime: v || "09:00" })} />
                    </div>
                  </div>
                  <p style={{ fontSize: 11, color: "var(--text-tertiary)", margin: 0, lineHeight: 1.5 }}>
                    時刻未設定のタスクの通知はこの時刻を基準にします。
                  </p>
                </div>
                <div style={{ padding: "12px 16px", backgroundColor: "var(--bg-badge)", borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <span style={{ fontSize: 14, fontWeight: 600, color: "var(--text-primary)" }}>新規タスクの通知を最初からON</span>
                  <button onClick={() => setS({ notifyDefaultOn: !s.notifyDefaultOn })} style={{
                    width: 52, height: 30, borderRadius: 15, border: "none", cursor: "pointer",
                    backgroundColor: s.notifyDefaultOn ? "var(--toggle-on)" : "var(--bg-checkbox)", position: "relative",
                  }}>
                    <div style={{ width: 24, height: 24, borderRadius: 12, backgroundColor: "#fff", position: "absolute", top: 3, left: s.notifyDefaultOn ? 25 : 3, transition: "left 0.2s", boxShadow: "0 1px 4px rgba(0,0,0,0.2)" }} />
                  </button>
                </div>
              </div>
            );
          })()}

          {USER_ID && (() => {
            const alertOn = (appData.settings || {}).overdueAlert !== false;
            const toggleAlert = () => {
              const newData = { ...appData, settings: { ...(appData.settings || {}), overdueAlert: !alertOn } };
              updateData(newData);
              syncNow(newData);
            };
            return (
              <div style={{ marginTop: 4, paddingTop: 16, borderTop: "1px solid var(--border)" }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: "var(--text-tertiary)", marginBottom: 10, letterSpacing: "0.06em" }}>
                  期限超過アラート
                </div>
                <div style={{ padding: "12px 16px", backgroundColor: "var(--bg-badge)", borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <span style={{ fontSize: 14, fontWeight: 600, color: "var(--text-primary)" }}>期限を過ぎたら通知</span>
                  <button onClick={toggleAlert} style={{
                    width: 52, height: 30, borderRadius: 15, border: "none", cursor: "pointer",
                    backgroundColor: alertOn ? "var(--toggle-on)" : "var(--bg-checkbox)", position: "relative",
                  }}>
                    <div style={{ width: 24, height: 24, borderRadius: 12, backgroundColor: "#fff", position: "absolute", top: 3, left: alertOn ? 25 : 3, transition: "left 0.2s", boxShadow: "0 1px 4px rgba(0,0,0,0.2)" }} />
                  </button>
                </div>
                {alertOn && (
                  <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                    {[{ v: 0, label: "すぐ" }, { v: 30, label: "30分後" }, { v: 60, label: "1時間後" }].map(o => {
                      const cur = typeof (appData.settings || {}).overdueGraceMin === "number" ? appData.settings.overdueGraceMin : 30;
                      const sel = cur === o.v;
                      return (
                        <button key={o.v} onClick={() => {
                          const newData = { ...appData, settings: { ...(appData.settings || {}), overdueGraceMin: o.v } };
                          updateData(newData);
                          syncNow(newData);
                        }} style={{
                          flex: 1, padding: "8px", borderRadius: 10, border: "none", cursor: "pointer",
                          backgroundColor: sel ? "var(--accent)" : "var(--bg-badge)",
                          color: sel ? "var(--accent-text)" : "var(--text-secondary)",
                          fontSize: 13, fontWeight: 600, fontFamily: "inherit",
                        }}>{o.label}</button>
                      );
                    })}
                  </div>
                )}
                <p style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "8px 0 0", lineHeight: 1.5 }}>
                  時刻つきの期限が対象。期限を過ぎて選んだ猶予が経っても未完了なら1回だけ通知します。
                </p>
              </div>
            );
          })()}

          <div style={{ marginTop: 4, paddingTop: 12, borderTop: "1px solid var(--border)", display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "var(--text-tertiary)", letterSpacing: "0.06em", marginBottom: 2 }}>データ</div>
            {(() => {
              const cur = (appData.settings || {}).autoCleanupDays || 0;
              const setDays = (v) => {
                const newData = { ...appData, settings: { ...(appData.settings || {}), autoCleanupDays: v } };
                updateData(newData);
                syncNow(newData);
              };
              return (
                <div style={{ padding: "12px 16px", backgroundColor: "var(--bg-badge)", borderRadius: 12 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: "var(--text-primary)", marginBottom: 8 }}>完了済みを自動削除</div>
                  <div style={{ display: "flex", gap: 6 }}>
                    {[{ v: 0, label: "オフ" }, { v: 3, label: "3日後" }, { v: 7, label: "7日後" }, { v: 30, label: "30日後" }].map(o => (
                      <button key={o.v} onClick={() => setDays(o.v)} style={{
                        flex: 1, padding: "8px", borderRadius: 10, border: "none", cursor: "pointer",
                        backgroundColor: cur === o.v ? "var(--accent)" : "var(--bg-card)",
                        color: cur === o.v ? "var(--accent-text)" : "var(--text-secondary)",
                        fontSize: 13, fontWeight: 600, fontFamily: "inherit",
                      }}>{o.label}</button>
                    ))}
                  </div>
                  <p style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "8px 0 0", lineHeight: 1.5 }}>
                    完了にした日時から数えて削除します（この設定を入れる前に完了したタスクは対象外）。
                    繰り返しタスクは自動・手動どちらの削除でも残ります。
                  </p>
                </div>
              );
            })()}
            <button onClick={() => { setTabs(tabs.map(t => ({ ...t, tasks: t.tasks.filter(x => !x.done || (x.repeat && x.repeat !== "none")) }))); setShowSettings(false); }} style={{
              width: "100%", padding: "14px 16px", borderRadius: 12, border: "none", cursor: "pointer",
              backgroundColor: "var(--bg-badge)", color: "var(--text-primary)",
              fontSize: 14, fontWeight: 600, fontFamily: "inherit", textAlign: "left",
            }}>完了済みタスクをすべて削除</button>

            <button onClick={() => {
              const newCds = [];
              const newData = { ...appData, countdowns: newCds };
              updateData(newData);
              setShowSettings(false);
            }} style={{
              width: "100%", padding: "14px 16px", borderRadius: 12, border: "none", cursor: "pointer",
              backgroundColor: "var(--bg-badge)", color: "var(--text-primary)",
              fontSize: 14, fontWeight: 600, fontFamily: "inherit", textAlign: "left",
            }}>カウントダウンをすべて削除</button>

            <div style={{ marginTop: 8 }}>
              <button onClick={resetData} style={{
                width: "100%", padding: "14px", borderRadius: 12, border: "none", cursor: "pointer",
                backgroundColor: "var(--danger-bg)", color: "var(--danger)",
                fontSize: 14, fontWeight: 700, fontFamily: "inherit",
              }}>すべてのデータをリセット</button>
              <p style={{ fontSize: 12, color: "var(--text-tertiary)", textAlign: "center", marginTop: 8, marginBottom: 0 }}>タブ・タスク・カウントダウンがすべて削除されます</p>
            </div>
          </div>
        </div>
      </Modal>

      <Modal isOpen={confirmClearDone} onClose={() => setConfirmClearDone(false)} title="完了済みを削除">
        <p style={{ fontSize: 14, color: "var(--text-secondary)", lineHeight: 1.6, margin: "0 0 20px" }}>
          完了済みのタスクをすべて削除します（繰り返しタスクは残ります）。この操作は元に戻せません。
        </p>
        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={() => setConfirmClearDone(false)} style={{ flex: 1, padding: "14px", borderRadius: 12, border: "1px solid var(--border)", cursor: "pointer", backgroundColor: "var(--bg-card)", color: "var(--text-primary)", fontSize: 15, fontWeight: 600, fontFamily: "inherit" }}>キャンセル</button>
          <button onClick={() => { clearDone(); setConfirmClearDone(false); }} style={{ flex: 1, padding: "14px", borderRadius: 12, border: "none", cursor: "pointer", backgroundColor: "#EF4444", color: "#fff", fontSize: 15, fontWeight: 700, fontFamily: "inherit" }}>削除する</button>
        </div>
      </Modal>

      <Modal isOpen={movingTaskId !== null} onClose={() => setMovingTaskId(null)} title="タブを移動">
        {movingTaskId && (() => {
          const task = tabs.flatMap(t => t.tasks).find(x => x.id === movingTaskId);
          const currentTabId = tabs.find(t => t.tasks.some(x => x.id === movingTaskId))?.id;
          return (
            <div>
              <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 16px", lineHeight: 1.6 }}>
                「{task?.text}」の移動先を選んでください
              </p>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {tabs.filter(t => t.id !== currentTabId).map(t => (
                  <button key={t.id} onClick={() => moveTask(movingTaskId, t.id)} style={{
                    padding: "14px 16px", borderRadius: 12, border: "none", cursor: "pointer",
                    backgroundColor: "var(--bg-badge)", color: "var(--text-primary)",
                    fontSize: 14, fontWeight: 600, fontFamily: "inherit",
                    display: "flex", alignItems: "center", gap: 10, textAlign: "left",
                  }}>
                    <span style={{ width: 10, height: 10, borderRadius: 5, backgroundColor: t.color || "#64748B", flexShrink: 0 }} />
                    {t.name}
                  </button>
                ))}
              </div>
            </div>
          );
        })()}
      </Modal>

      <style>{`
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input::placeholder, textarea::placeholder { color: var(--text-tertiary); }
        select { -webkit-appearance: auto; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: transparent; border-radius: 10px; transition: background 0.3s; }
        *:hover::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); }
        *::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,0.55); }
        * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
        *:hover { scrollbar-color: rgba(100,116,139,0.3) transparent; }
        #tab-scroll-bar::-webkit-scrollbar { height: 3px; }
        #tab-scroll-bar::-webkit-scrollbar-thumb { background: transparent; border-radius: 10px; }
        #tab-scroll-bar:hover::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.4); }
      `}</style>
    </div>
  );
}

    const domNode = document.getElementById('root');
    const root = ReactDOM.createRoot(domNode);
    root.render(React.createElement(TodoApp));
  </script>
</body>
</html>
