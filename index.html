const WEEKDAYS_JP = ["日", "月", "火", "水", "木", "金", "土"];

const ORDINALS = [

const NOTIFY_OPTIONS = [
  { key: "on_time", label: "ちょうど" },
  { key: "5min", label: "5分前" },
  { key: "10min", label: "10分前" },
  { key: "15min", label: "15分前" },
  { key: "30min", label: "30分前" },
  { key: "1hour", label: "1時間前" },
  { key: "1day", label: "1日前" },
  { key: "custom", label: "カスタム" },
];

const NOTIFY_MINUTES_MAP = {
  "on_time": 0, "5min": 5, "10min": 10, "15min": 15,
  "30min": 30, "1hour": 60, "1day": 1440,
};

// 通知タイミングは複数選択可。旧データ（notifyTiming単体）もフォールバックで読む
function getTaskTimings(task) {
  if (task.notifyTimings && task.notifyTimings.length) return task.notifyTimings;
  return [task.notifyTiming || "on_time"];
}

function timingToMinutes(task, key) {
  if (key === "custom") return Math.max(0, parseInt(task.notifyCustomMin) || 0);
  return NOTIFY_MINUTES_MAP[key] || 0;
}

function getNotifyMinutesList(task) {
  return [...new Set(getTaskTimings(task).map(k => timingToMinutes(task, k)))];
}

function formatMinutesBefore(min) {
  if (min === 0) return "ちょうど";
  const days = Math.floor(min / 1440);
  const hours = Math.floor((min % 1440) / 60);
  const mins = min % 60;
  let parts = [];
  if (days) parts.push(days + "日");
  if (hours) parts.push(hours + "時間");
  if (mins) parts.push(mins + "分");
  return parts.join("") + "前";
}

function getNotifyLabel(task) {
  const labels = getTaskTimings(task).map(k => {
    if (k === "custom") return formatMinutesBefore(parseInt(task.notifyCustomMin) || 0);
    const opt = NOTIFY_OPTIONS.find(n => n.key === k);
    return opt ? opt.label : "";
  }).filter(Boolean);
  return labels.join("・");
}

const NOTIFY_CATEGORIES = [
  { key: "overdue",      icon: "⚠️", label: "期限切れ" },
  { key: "today",        icon: "📅", label: "今日が期限" },
  { key: "future",       icon: "🔮", label: "明日以降の期限あり" },
  { key: "highPriority", icon: "🔥", label: "高優先度（期限なし）" },
];

const DEFAULT_NOTIFY_CATEGORIES = ["overdue", "today", "future", "highPriority"];

const MIN_PRIORITY_OPTIONS = [
  { key: "all",    label: "すべて" },
  { key: "medium", label: "中以上" },
  { key: "high",   label: "高以上" },
];

const SORT_OPTIONS = [
  { key: "order", label: "順番" },
  { key: "created", label: "作成順" },
  { key: "dueDate", label: "期限" },
  { key: "priority", label: "優先度" },
  { key: "progress", label: "進捗" },
];

const GAS_URL = "https://script.google.com/macros/s/AKfycbyREDlXblHd1ICrEnnrM_CsnQ61jNACJ8nXRaRrnCPfBsunsu3mgM79EOG_MQACgugCRw/exec";

// ?user= は一度開けば記憶し、以後は素のURLでも同期・通知設定が使えるようにする
const USER_ID = (() => {
  const fromUrl = new URLSearchParams(window.location.search).get('user');
  if (fromUrl) {
    try { localStorage.setItem("todo-app-userId", fromUrl); } catch (e) {}
    return fromUrl;
  }
  try { return localStorage.getItem("todo-app-userId") || null; } catch (e) { return null; }
})();

// localStorageに保存済みのappDataからsettingsを読む（トップレベル関数から参照する用）
function getLocalSettings() {
  try {
    const raw = JSON.parse(localStorage.getItem("todo-app-v6"));
    return (raw && raw.settings) || {};
  } catch (e) { return {}; }
}

// 時刻未設定タスクの通知基準時刻（設定で変更可、既定9:00）
function getDefaultNotifyTime() {
  const t = getLocalSettings().defaultNotifyTime;
  return (typeof t === "string" && /^\d{2}:\d{2}$/.test(t)) ? t : "09:00";
}

function sendNotifyToGAS(task) {
  if (!task.notify || !task.dueDate || !USER_ID) return;
  const timeStr = task.dueTime || getDefaultNotifyTime();
  const notifyAts = getNotifyMinutesList(task).map(mins => {
    const t = new Date(task.dueDate + "T" + timeStr);
    t.setMinutes(t.getMinutes() - mins);
    return t.toISOString();
  });

  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      action: "notify",
      userId: USER_ID,
      taskId: task.id || "",
      taskName: task.text,
      notifyAts: notifyAts,
      notifyAt: notifyAts[0], // 旧GAS向けフォールバック
    }),
  }).catch(() => {});
}

function cancelNotifyOnGAS(taskId) {
  if (!taskId || !USER_ID) return;
  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ action: "cancel", userId: USER_ID, taskId: taskId }),
  }).catch(() => {});
}

function sendSaveSettingsToGAS(settings) {
  if (!USER_ID) return;
  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      action: "saveSettings",
      userId: USER_ID,
      ...settings,
    }),
  }).catch(() => {});
}

const ACCENT = "var(--accent)";
const ALL_TAB = "__all__";
const COUNTDOWN_TAB = "__countdown__";
const gid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const emptyTask = {
  text: "", memo: "", dueDate: "", dueTime: "", priority: "none",
  notify: false, notifyTiming: "on_time", notifyTimings: ["on_time"], repeat: "none",
  repeatDays: [], repeatMonthDay: 1, monthMode: "date",
  monthOrdinal: 1, monthWeekday: 1, customInterval: 1,
  customUnit: "day", progress: 0,
};

function getTabStyle(tab, darkMode) {
  if (!tab || !tab.color) {
    return { main: "#64748B", bg: darkMode ? "#2A2F38" : "#F1F5F9" };
  }
  const found = TAB_COLORS.find(c => c.value === tab.color);
  if (!found) return { main: tab.color, bg: darkMode ? "#2A2F38" : "#F1F5F9" };
  return { main: found.value, bg: darkMode ? found.dark : found.light };
}

function daysUntil(dateStr) {
  const target = new Date(dateStr + "T00:00:00");
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.ceil((target - now) / 86400000);
}

function getRepeatLabel(task) {
  const r = task.repeat;
  if (!r || r === "none") return null;
  if (r === "daily") return "毎日";
  if (r === "weekdays") return "平日";
  if (r === "weekly") {
    const d = (task.repeatDays || []).map(i => WEEKDAYS_JP[i]).join("・");
    return d ? "毎週 " + d : "毎週";
  }
  if (r === "monthly") {
    if (task.monthMode === "weekday") {
      const ord = ORDINALS.find(o => o.key === task.monthOrdinal);
      return "毎月" + (ord ? ord.label : "") + (WEEKDAYS_JP[task.monthWeekday] || "") + "曜";
    }
    return "毎月" + (task.repeatMonthDay || 1) + "日";
  }
  if (r === "custom") {
    const iv = task.customInterval || 1;
    const u = task.customUnit || "day";
    if (u === "day") return iv + "日ごと";
    if (u === "week") {
      const d = (task.repeatDays || []).map(i => WEEKDAYS_JP[i]).join("・");
      return d ? iv + "週ごと " + d : iv + "週ごと";
    }
    if (u === "month") {
      if (task.monthMode === "weekday") {
        const ord = ORDINALS.find(o => o.key === task.monthOrdinal);
        return iv + "ヶ月ごと " + (ord ? ord.label : "") + (WEEKDAYS_JP[task.monthWeekday] || "") + "曜";
      }
      return iv + "ヶ月ごと " + (task.repeatMonthDay || 1) + "日";
    }
  }
  return null;
}

const SORT_DEFAULTS = { order: "asc", priority: "asc", progress: "desc", dueDate: "asc", created: "desc" };

function computeNextOccurrence(task, baseTs) {
  const base = new Date(baseTs || Date.now());
  const r = task.repeat;

  const next = new Date(base);
  next.setDate(next.getDate() + 1);
  next.setHours(0, 0, 0, 0);

  if (r === "daily") return next.getTime();

  if (r === "weekdays") {
    while (next.getDay() === 0 || next.getDay() === 6) {
      next.setDate(next.getDate() + 1);
    }
    return next.getTime();
  }

  if (r === "weekly") {
    const days = (task.repeatDays || []).slice().sort((a, b) => a - b);
    if (days.length === 0) {
      const d = new Date(base);
      d.setDate(d.getDate() + 7);
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }
    for (let i = 0; i < 8; i++) {
      if (days.indexOf(next.getDay()) !== -1) return next.getTime();
      next.setDate(next.getDate() + 1);
    }
    return next.getTime();
  }

  if (r === "monthly") {
    const d = new Date(base);
    if (task.monthMode === "weekday") {
      d.setDate(1);
      d.setMonth(d.getMonth() + 1);
      const ord = task.monthOrdinal || 1;
      const wd = task.monthWeekday != null ? task.monthWeekday : 0;
      if (ord > 0) {
        while (d.getDay() !== wd) d.setDate(d.getDate() + 1);
        d.setDate(d.getDate() + (ord - 1) * 7);
      } else {
        d.setMonth(d.getMonth() + 1);
        d.setDate(0);
        while (d.getDay() !== wd) d.setDate(d.getDate() - 1);
      }
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }
    d.setDate(1);
    d.setMonth(d.getMonth() + 1);
    const targetDay = task.repeatMonthDay || 1;
    const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(targetDay, lastDay));
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  if (r === "custom") {
    const iv = Math.max(1, task.customInterval || 1);
    const unit = task.customUnit || "day";
    const d = new Date(base);
    d.setHours(0, 0, 0, 0);
    if (unit === "day") d.setDate(d.getDate() + iv);
    else if (unit === "week") d.setDate(d.getDate() + iv * 7);
    else if (unit === "month") d.setMonth(d.getMonth() + iv);
    return d.getTime();
  }

  return next.getTime();
}

function tsToDateStr(ts) {
  const d = new Date(ts);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// 繰り返しタスクの「次回発生日」。今日がパターンに一致し期限時刻をまだ過ぎていなければ今日
function nextOccurrenceDateStr(task) {
  const now = new Date();
  const timeStr = task.dueTime || getDefaultNotifyTime();
  const todayDue = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
    parseInt(timeStr.slice(0, 2), 10) || 0, parseInt(timeStr.slice(3, 5), 10) || 0);

  const matchesToday = (() => {
    const r = task.repeat;
    const dow = now.getDay();
    if (r === "daily") return true;
    if (r === "weekdays") return dow >= 1 && dow <= 5;
    if (r === "weekly") {
      const d = task.repeatDays || [];
      return d.length === 0 || d.includes(dow);
    }
    if (r === "monthly") {
      if (task.monthMode === "weekday") {
        const d = new Date(now.getFullYear(), now.getMonth(), 1);
        const ord = task.monthOrdinal || 1;
        const wd = task.monthWeekday != null ? task.monthWeekday : 0;
        if (ord > 0) {
          while (d.getDay() !== wd) d.setDate(d.getDate() + 1);
          d.setDate(d.getDate() + (ord - 1) * 7);
        } else {
          d.setMonth(d.getMonth() + 1);
          d.setDate(0);
          while (d.getDay() !== wd) d.setDate(d.getDate() - 1);
        }
        return d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
      }
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      return now.getDate() === Math.min(task.repeatMonthDay || 1, lastDay);
    }
    return true; // custom等は固定アンカーがないため今日を初回にできる
  })();

  const ts = (matchesToday && todayDue.getTime() > now.getTime())
    ? todayDue.getTime()
    : computeNextOccurrence(task, now.getTime());
  return tsToDateStr(ts);
}

function resetRepeatTasks(appData) {
  const now = Date.now();
  let changed = false;
  const toReschedule = [];
  const newTabs = (appData.tabs || []).map(tab => {
    const newTasks = tab.tasks.map(task => {
      if (!task.done) return task;
      if (!task.repeat || task.repeat === "none") return task;
      if (!task.lastCompletedAt) return task;
      const nextAt = computeNextOccurrence(task, task.lastCompletedAt);
      if (nextAt <= now) {
        changed = true;
        const reset = { ...task, done: false, progress: 0, lastCompletedAt: null };
        delete reset.overdueAlerted; // 新しい期限で超過アラートを再度有効に
        // 期限日つきの繰り返しタスクは期限を次回日付へ更新し、通知予約も再登録する
        if (task.dueDate) {
          reset.dueDate = tsToDateStr(nextAt);
          if (reset.notify) toReschedule.push(reset);
        }
        return reset;
      }
      return task;
    });
    return { ...tab, tasks: newTasks };
  });
  toReschedule.forEach(t => sendNotifyToGAS(t));
  return changed ? { ...appData, tabs: newTabs } : appData;
}

// 完了から指定日数が経ったタスクを自動削除（completedAtを持つタスクのみ対象）
function autoCleanupDoneTasks(appData) {
  const days = (appData.settings || {}).autoCleanupDays;
  if (!days || days <= 0) return appData;
  const cutoff = Date.now() - days * 86400000;
  let changed = false;
  const newTabs = (appData.tabs || []).map(tab => {
    const keep = (tab.tasks || []).filter(t => {
      // 繰り返しタスクは自動リセットで復活する前提のため削除対象外
      const drop = t.done && t.completedAt && t.completedAt < cutoff && (!t.repeat || t.repeat === "none");
      if (drop) changed = true;
      return !drop;
    });
    return keep.length === (tab.tasks || []).length ? tab : { ...tab, tasks: keep };
  });
  return changed ? { ...appData, tabs: newTabs } : appData;
}

function doSort(tasks, key, dir) {
  const d = dir === "desc" ? -1 : 1;
  if (key === "order") {
    // 配列順を保持（undone を上に）。dirが desc なら逆順
    const undone = tasks.filter(t => !t.done);
    const done = tasks.filter(t => t.done);
    const body = d === 1 ? undone : [...undone].reverse();
    return body.concat(done);
  }
  return [...tasks].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (key === "priority") {
      const pa = (PRIORITIES.find(p => p.key === (a.priority || "none")) || {}).sort ?? 4;
      const pb = (PRIORITIES.find(p => p.key === (b.priority || "none")) || {}).sort ?? 4;
      return (pa - pb) * d;
    }
    if (key === "progress") return ((a.progress || 0) - (b.progress || 0)) * d;
    if (key === "dueDate") {
      if (a.dueDate && b.dueDate) return (new Date(a.dueDate) - new Date(b.dueDate)) * d;
      if (a.dueDate) return -1;
      if (b.dueDate) return 1;
      return 0;
    }
    return ((a.createdAt || 0) - (b.createdAt || 0)) * d;
  });
}

function useStorage() {
  const [appData, setAppData] = useState({ tabs: [], countdowns: [] });
  const [loaded, setLoaded] = useState(false);
  const [lastSyncAt, setLastSyncAt] = useState(null);
  const latestDataRef = useRef({ tabs: [], countdowns: [] });
  const localUpdatedAtRef = useRef(null);
  const debounceRef = useRef(null);

  useEffect(() => {
    let hasLocal = false;

    // Step 1: localStorage を即座に読み込み → 表示
    try {
      const r = localStorage.getItem("todo-app-v6");
      const tsr = localStorage.getItem("todo-app-v6-updatedAt");
      if (r) {
        const parsed = JSON.parse(r);
        setAppData(parsed);
        latestDataRef.current = parsed;
        localUpdatedAtRef.current = tsr || null;
        setLoaded(true);
        hasLocal = true;
      }
    } catch (e) {}

    // Step 2: 裏でGASから最新を取得し、より新しければ静かに差し替え
    if (USER_ID) {
      (async () => {
        try {
          const res = await fetch(`${GAS_URL}?action=load&userId=${USER_ID}`);
          const json = await res.json();
          if (json.data) {
            const gasTs = json.updatedAt || null;
            const localTs = localUpdatedAtRef.current;
            // GASの方が厳密に新しい場合だけ差し替え（編集中の上書きを防止）
            const shouldSwap = !hasLocal || (gasTs && (!localTs || gasTs > localTs));
            if (shouldSwap) {
              const parsed = JSON.parse(json.data);
              setAppData(parsed);
              latestDataRef.current = parsed;
              localUpdatedAtRef.current = gasTs;
              try {
                localStorage.setItem("todo-app-v6", JSON.stringify(parsed));
                if (gasTs) localStorage.setItem("todo-app-v6-updatedAt", gasTs);
              } catch (e) {}
            }
          }
        } catch (e) {
          console.log("GAS background load failed");
        }
        if (!hasLocal) setLoaded(true);
      })();
    } else if (!hasLocal) {
      setLoaded(true);
    }
  }, []);

  // Discord側の完了/スヌーズ操作を取り込む: フォーカス時、未送信のローカル編集がなければ
  // クラウドの方が新しい場合だけ静かに差し替える（巻き戻り対策）
  useEffect(() => {
    if (!USER_ID) return;
    const pullIfNewer = async () => {
      if (debounceRef.current) return; // ローカル編集の未送信分を上書きしない
      try {
        const res = await fetch(`${GAS_URL}?action=load&userId=${USER_ID}`);
        const json = await res.json();
        if (json.data && json.updatedAt && (!localUpdatedAtRef.current || json.updatedAt > localUpdatedAtRef.current)) {
          const parsed = JSON.parse(json.data);
          setAppData(parsed);
          latestDataRef.current = parsed;
          localUpdatedAtRef.current = json.updatedAt;
          try {
            localStorage.setItem("todo-app-v6", JSON.stringify(parsed));
            localStorage.setItem("todo-app-v6-updatedAt", json.updatedAt);
          } catch (e) {}
        }
      } catch (e) {}
    };
    const onFocus = () => pullIfNewer();
    const onVis = () => { if (document.visibilityState === "visible") pullIfNewer(); };
    window.addEventListener("focus", onFocus);
    document.addEventListener("visibilitychange", onVis);
    return () => {
      window.removeEventListener("focus", onFocus);
      document.removeEventListener("visibilitychange", onVis);
    };
  }, []);

  const syncToGAS = useCallback((data) => {
    if (!USER_ID) return;
    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "sync",
        userId: USER_ID,
        data: JSON.stringify(data),
        updatedAt: new Date().toISOString(),
      }),
    }).catch(() => {});
    setLastSyncAt(Date.now());
  }, []);

  const save = useCallback((d) => {
    latestDataRef.current = d;
    const ts = new Date().toISOString();
    try {
      localStorage.setItem("todo-app-v6", JSON.stringify(d));
      localStorage.setItem("todo-app-v6-updatedAt", ts);
    } catch (e) {}
    localUpdatedAtRef.current = ts;
    if (USER_ID) {
      if (debounceRef.current) clearTimeout(debounceRef.current);
      debounceRef.current = setTimeout(() => { debounceRef.current = null; syncToGAS(d); }, 5000);
    }
  }, [syncToGAS]);

  const syncNow = useCallback((d) => {
    if (debounceRef.current) { clearTimeout(debounceRef.current); debounceRef.current = null; }
    syncToGAS(d !== undefined ? d : latestDataRef.current);
  }, [syncToGAS]);

  const forcePull = useCallback(async () => {
    if (!USER_ID) return false;
    try {
      const res = await fetch(`${GAS_URL}?action=load&userId=${USER_ID}`);
      const json = await res.json();
      if (json.data) {
        const parsed = JSON.parse(json.data);
        setAppData(parsed);
        latestDataRef.current = parsed;
        const gasTs = json.updatedAt || new Date().toISOString();
        try {
          localStorage.setItem("todo-app-v6", JSON.stringify(parsed));
          localStorage.setItem("todo-app-v6-updatedAt", gasTs);
        } catch (e) {}
        localUpdatedAtRef.current = gasTs;
        return true;
      }
    } catch (e) {}
    return false;
  }, []);

  const updateData = useCallback((d) => {
    setAppData(d);
    save(d);
  }, [save]);

  return { appData, updateData, loaded, syncNow, forcePull, lastSyncAt };
}

function timeAgo(ts) {
  if (!ts) return "";
  const diff = Date.now() - ts;
  if (diff < 60000) return "たった今";
  if (diff < 3600000) return Math.floor(diff / 60000) + "分前";
  if (diff < 86400000) return Math.floor(diff / 3600000) + "時間前";
  return Math.floor(diff / 86400000) + "日前";
}

function TimeInput({ value, onChange }) {
  const [raw, setRaw] = useState(value || "");
  useEffect(() => { setRaw(value || ""); }, [value]);

  const normalize = (input) => {
    const d = input.replace(/[^\d]/g, "").slice(0, 4);
    if (!d) return "";
    if (d.length <= 2) {
      return String(Math.min(parseInt(d, 10), 23)).padStart(2, "0") + ":00";
    }
    const h = Math.min(parseInt(d.slice(0, 2), 10), 23);
    const m = Math.min(parseInt(d.slice(2, 4), 10), 59);
    return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  };

  const handleChange = (e) => {
    const digits = e.target.value.replace(/[^\d]/g, "");
    if (digits.length > 4) return;
    setRaw(e.target.value);
  };

  const handleBlur = () => {
    if (!raw.trim()) { onChange(""); return; }
    const n = normalize(raw);
    setRaw(n);
    onChange(n);
  };

  return (
    <input
      value={raw}
      onChange={handleChange}
      onBlur={handleBlur}
      onKeyDown={e => e.key === "Enter" && e.target.blur()}
      placeholder="00:00"
      inputMode="numeric"
      style={{
        width: "100%", padding: "10px 16px", borderRadius: 12,
        border: "1px solid var(--border)", backgroundColor: "var(--bg-input)",
        color: "var(--text-primary)", fontSize: 14, fontFamily: "inherit",
        outline: "none", boxSizing: "border-box", textAlign: "center",
      }}
    />
  );
}

function DateInput({ value, onChange, style }) {
  const inputRef = useRef(null);
  const [hasValue, setHasValue] = useState(!!value);
  const [typing, setTyping] = useState("");

  // 外部から value が変化したら DOM を直接更新（uncontrolled でも追従）
  useEffect(() => {
    if (inputRef.current && inputRef.current.value !== (value || "")) {
      inputRef.current.value = value || "";
    }
    setHasValue(!!value);
  }, [value]);

  const commitDigits = (digits) => {
    if (!digits) return;
    const yr = new Date().getFullYear();
    let iso = "";
    if (digits.length === 4) iso = `${yr}-${digits.slice(0,2)}-${digits.slice(2,4)}`;
    else if (digits.length === 6) iso = `20${digits.slice(0,2)}-${digits.slice(2,4)}-${digits.slice(4,6)}`;
    else if (digits.length === 8) iso = `${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}`;
    if (iso) {
      onChange(iso);
      if (inputRef.current) inputRef.current.value = iso;
      setHasValue(true);
    }
    setTyping("");
  };

  return (
    <div style={{ position: "relative", width: "100%" }}>
      <input
        type="date"
        ref={inputRef}
        defaultValue={value || ""}
        onChange={e => {
          const v = e.target.value;
          setHasValue(!!v);
          onChange(v);
          setTyping("");
        }}
        onClick={e => e.stopPropagation()}
        onTouchStart={e => e.stopPropagation()}
        onKeyDown={e => {
          if (/^\d$/.test(e.key)) {
            e.preventDefault();
            const cur = (typing + e.key).slice(0, 8);
            setTyping(cur);
            if (cur.length === 8 || cur.length === 6 || cur.length === 4) commitDigits(cur);
          } else if (e.key === "Enter") {
            commitDigits(typing);
          } else if (e.key === "Backspace") {
            setTyping(t => t.slice(0, -1));
          } else if (e.key === "Escape") {
            setTyping("");
          }
        }}
        style={{
          width: "100%", padding: "10px 12px", borderRadius: 12,
          border: "1px solid var(--border)", backgroundColor: "var(--bg-input)",
          color: "var(--text-primary)",
          fontSize: 14, fontFamily: "inherit",
          outline: "none", boxSizing: "border-box",
          colorScheme: "light dark",
          ...style,
        }}
      />
      {!hasValue && (
        <div style={{
          position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)",
          color: "var(--text-tertiary)", fontSize: 14, pointerEvents: "none",
          opacity: 0.6, fontFamily: "inherit",
        }}>
          ----/--/--
        </div>
      )}
      {typing && (
        <div style={{
          marginTop: 4, padding: "5px 10px", borderRadius: 8,
          backgroundColor: ACCENT, display: "inline-flex", alignItems: "center", gap: 4,
          fontSize: 13, fontWeight: 700, color: "var(--accent-text)",
          letterSpacing: "0.06em",
        }}>
          {typing}
          <span style={{ opacity: 0.6 }}>_</span>
        </div>
      )}
    </div>
  );
}

  if (days === 0) return { label: "今日！", color: "var(--success)" };
  if (days <= 7) return { label: "あと" + days + "日", color: "#F97316" };
  if (days <= 30) return { label: "あと" + days + "日", color: "#EAB308" };
  return { label: "あと" + days + "日", color: ACCENT };
}

function daysBetween(startStr, endStr) {
  if (!startStr || !endStr) return null;
  const s = new Date(startStr + "T00:00:00");
  const e = new Date(endStr + "T00:00:00");
  return Math.ceil((e - s) / 86400000);
}

  const calcDays = daysBetween(calcStart, calcEnd);

  const [baseDate, setBaseDate] = useState(tsToDateStr(Date.now()));
  const [offsetDays, setOffsetDays] = useState("");
  const [offsetDir, setOffsetDir] = useState("after"); // after | before

  const offsetNum = parseInt(offsetDays, 10);

    const d = new Date(baseDate + "T00:00:00");

}

function CountdownPanel({ countdowns, onAdd, onDelete, onUpdate }) {

  const [name, setName] = useState("");
  const [date, setDate] = useState("");
  const [editingCd, setEditingCd] = useState(null);

  const handleAdd = () => {
    if (!name.trim() || !date) return;
    onAdd({
      id: gid(), name: name.trim(), date,
      reminder: { enabled: false, dailyFromDays: 7, milestone: false, dailyAll: false, lastNotify: null },
    });
    setName(""); setDate(""); setAdding(false);

  const openEdit = (cd) => setEditingCd({
    ...cd,
    reminder: { enabled: false, dailyFromDays: 7, milestone: false, dailyAll: false, lastNotify: null, ...(cd.reminder || {}) },
  });

  const saveEdit = () => {
    if (!editingCd || !editingCd.name.trim() || !editingCd.date) return;

    setEditingCd(null);

          return (
            <div key={cd.id} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "14px 16px", backgroundColor: "var(--bg-card)",
              borderRadius: 14,
              border: "1px solid var(--border)", borderLeftWidth: 3, borderLeftColor: color,
            }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: "var(--text-primary)", display: "flex", alignItems: "center", gap: 5 }}>
                  {cd.name}
                  {hasReminder && <span style={{ fontSize: 12, opacity: 0.7 }}>🔔</span>}
                </div>
                <div style={{ fontSize: 12, color: "var(--text-tertiary)", marginTop: 2 }}>
                  {new Date(cd.date).toLocaleDateString("ja-JP", { year: "numeric", month: "short", day: "numeric", weekday: "short" })}

                <button onClick={() => onDelete(cd.id)} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "var(--text-tertiary)", opacity: 0.6, fontSize: 16, lineHeight: 1 }}>✕</button>

      {adding ? (

          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={handleAdd} disabled={!name.trim() || !date} style={{
              flex: 1, padding: "10px", borderRadius: 10, border: "none", cursor: "pointer",
              backgroundColor: (name.trim() && date) ? ACCENT : "var(--bg-badge)",
              color: (name.trim() && date) ? "var(--accent-text)" : "var(--text-tertiary)",

              />
              <DateInput value={editingCd.date} onChange={d => setEditingCd({ ...editingCd, date: d })} />
              <CountdownReminderPanel

              <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                <button onClick={saveEdit} disabled={!editingCd.name.trim() || !editingCd.date} style={{
                  flex: 1, padding: "12px", borderRadius: 12, border: "none", cursor: "pointer",
                  backgroundColor: (editingCd.name.trim() && editingCd.date) ? ACCENT : "var(--bg-badge)",
                  color: (editingCd.name.trim() && editingCd.date) ? "var(--accent-text)" : "var(--text-tertiary)",
                  fontSize: 14, fontWeight: 700, fontFamily: "inherit",
                }}>保存</button>
                <button onClick={() => setEditingCd(null)} style={{
                  padding: "12px 20px", borderRadius: 12, border: "1px solid var(--border)",
                  cursor: "pointer", backgroundColor: "var(--bg-card)",
                  color: "var(--text-secondary)", fontSize: 14, fontFamily: "inherit",
                }}>キャンセル</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const TASK_SIZE_BASE = { padY: 8, padX: 16, font: 15, checkSize: 28, badgeFont: 11, memoFont: 13 };
const TASK_SIZE_MIN = 0.5;
const TASK_SIZE_MAX = 2.0;
const TASK_SIZE_DEFAULT = 1.0;

function getTaskSizeScale(v) {
  // 旧データ互換
  if (v === 'small') return 0.85;
  if (v === 'medium') return 1.0;
  if (v === 'large') return 1.2;
  const n = parseFloat(v);
  if (isNaN(n)) return TASK_SIZE_DEFAULT;
  return Math.max(TASK_SIZE_MIN, Math.min(TASK_SIZE_MAX, n));
}

function buildTaskSize(scale) {
  return {
    padY:      Math.round(TASK_SIZE_BASE.padY * scale),
    padX:      Math.round(TASK_SIZE_BASE.padX * scale),
    font:      Math.round(TASK_SIZE_BASE.font * scale),
    checkSize: Math.round(TASK_SIZE_BASE.checkSize * scale),
    badgeFont: Math.max(9, Math.round(TASK_SIZE_BASE.badgeFont * scale)),
    memoFont:  Math.max(10, Math.round(TASK_SIZE_BASE.memoFont * scale)),
  };
}

function TaskItem({ task, tabStyle, onToggle, onDelete, onEdit, showTabName, onReorderDragStart, onReorderDragOver, onReorderDrop, onReorderDragEnd, isDragging, isDragOver, taskSize }) {
  const sz = buildTaskSize(getTaskSizeScale(taskSize));
  const ts = tabStyle || { main: "#64748B", bg: "#F1F5F9" };
  const isRepeat = task.repeat && task.repeat !== "none";
  const progress = task.progress || 0;
  const rl = getRepeatLabel(task);

  const dt = task.dueDate ? new Date(task.dueDate + (task.dueTime ? "T" + task.dueTime : "T23:59")) : null;
  const overdue = dt && dt < new Date() && !task.done;

  const priObj = PRIORITIES.find(x => x.key === (task.priority || "none"));

  // 左端の細バー: 期限切れ > 緊急/高優先度 のときだけ色を出す
  const barColor = !task.done && overdue ? "var(--danger)"
    : (!task.done && priObj && (priObj.key === "urgent" || priObj.key === "high")) ? priObj.color
    : null;

  const [swipeX, setSwipeX] = useState(0);
  const [dragMode, setDragMode] = useState(false); // mobile long-press drag
  const touchStartX = useRef(null);
  const touchStartY = useRef(null);
  const gestureMode = useRef(null); // null | "swipe" | "drag"
  const longPressTimer = useRef(null);

  const startLongPress = () => {
    if (longPressTimer.current) clearTimeout(longPressTimer.current);
    longPressTimer.current = setTimeout(() => {
      if (gestureMode.current == null) {
        gestureMode.current = "drag";
        setDragMode(true);
        onReorderDragStart && onReorderDragStart(task.id);
        if (navigator.vibrate) navigator.vibrate(15);
      }
      longPressTimer.current = null;
    }, 400);
  };
  const cancelLongPress = () => {
    if (longPressTimer.current) { clearTimeout(longPressTimer.current); longPressTimer.current = null; }
  };

  const onTouchStart = (e) => {
    touchStartX.current = e.touches[0].clientX;
    touchStartY.current = e.touches[0].clientY;
    gestureMode.current = null;
    startLongPress();
  };
  const onTouchMove = (e) => {
    if (touchStartX.current == null) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStartX.current;
    const dy = t.clientY - touchStartY.current;

    if (gestureMode.current === "drag") {
      e.preventDefault();
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const taskEl = el && el.closest && el.closest("[data-task-id]");
      if (taskEl) {
        const overId = taskEl.getAttribute("data-task-id");
        if (overId && overId !== task.id) onReorderDragOver && onReorderDragOver(overId);
      }
      return;
    }

    if (gestureMode.current == null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      cancelLongPress();
      if (Math.abs(dx) > Math.abs(dy)) {
        gestureMode.current = "swipe";
      } else {
        gestureMode.current = "scroll";
      }
    }
    if (gestureMode.current === "swipe") setSwipeX(Math.max(-120, Math.min(0, dx)));
  };
  const onTouchEnd = () => {
    cancelLongPress();
    if (gestureMode.current === "drag") {
      onReorderDrop && onReorderDrop();
      setDragMode(false);
    } else if (gestureMode.current === "swipe" && swipeX <= -80) {
      setSwipeX(0);
      onDelete(task.id);
    } else if (gestureMode.current === "swipe") {
      setSwipeX(0);
    }
    touchStartX.current = null;
    touchStartY.current = null;
    gestureMode.current = null;
  };

  const handleCardClick = () => {
    if (dragMode) return;
    onEdit(task);
  };

  return (
    <div
      data-task-id={task.id}
      draggable
      onDragStart={(e) => { onReorderDragStart && onReorderDragStart(task.id); try { e.dataTransfer.effectAllowed = "move"; } catch (_) {} }}
      onDragOver={(e) => { e.preventDefault(); onReorderDragOver && onReorderDragOver(task.id); }}
      onDrop={(e) => { e.preventDefault(); onReorderDrop && onReorderDrop(); }}
      onDragEnd={() => onReorderDragEnd && onReorderDragEnd()}
      style={{ position: "relative", marginBottom: 0, borderRadius: 0, overflow: "hidden", opacity: isDragging ? 0.4 : 1, transform: dragMode ? "scale(1.01)" : "scale(1)", transition: "opacity 0.15s, transform 0.15s", boxShadow: dragMode ? "0 8px 24px rgba(0,0,0,0.2)" : "none" }}>
      {isDragOver && (
        <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 3, backgroundColor: ACCENT, borderRadius: 2, zIndex: 3 }} />
      )}
      <div style={{
        position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "flex-end",
        paddingRight: 20, backgroundColor: "#EF4444", color: "#fff",
        fontSize: 13, fontWeight: 700,
      }}>削除</div>
      <div
        onClick={handleCardClick}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        style={{
          display: "flex", alignItems: "flex-start", gap: 13, padding: sz.padY + "px " + sz.padX + "px",
          background: "var(--bg-main)", borderRadius: 0,
          borderLeft: "3px solid " + (barColor || "transparent"),
          borderBottom: "1px solid var(--row-border)",
          opacity: task.done ? 0.55 : 1, position: "relative",
          transition: swipeX === 0 ? "background 0.3s, transform 0.2s" : "none",
          transform: "translateX(" + swipeX + "px)",
          cursor: "pointer",
          userSelect: "none", WebkitUserSelect: "none", touchAction: "pan-y",
        }}>
        <button onClick={(e) => { e.stopPropagation(); onToggle(task.id); }} style={{
          width: sz.checkSize, height: sz.checkSize, minWidth: sz.checkSize, borderRadius: 6,
          border: task.done ? "1.5px solid var(--accent)" : "1.5px solid var(--check-border)",
          cursor: "pointer", backgroundColor: task.done ? "var(--accent)" : "transparent",
          color: "var(--accent-text)",
          display: "flex", alignItems: "center", justifyContent: "center",
          marginTop: 2, position: "relative", zIndex: 1,
        }}>
          {task.done && <CheckIcon />}
        </button>

        <div style={{ flex: 1, minWidth: 0, position: "relative", zIndex: 1 }}>
          <span style={{
            fontSize: sz.font, lineHeight: 1.5, fontWeight: 600,
            color: task.done ? "var(--text-tertiary)" : "var(--text-primary)",
            textDecoration: task.done ? "line-through" : "none", wordBreak: "break-word",
            display: "block",
          }}>{task.text}</span>

          {task.memo && (
            <p style={{ margin: "3px 0 0", fontSize: sz.memoFont, color: "var(--text-secondary)", lineHeight: 1.4 }}>{task.memo}</p>
          )}

          <div style={{ display: "flex", alignItems: "center", gap: 11, flexWrap: "wrap", marginTop: 4, minHeight: Math.round(sz.badgeFont * 1.5) }}>
            {task.dueDate && (
              <span style={{
                fontSize: sz.badgeFont, fontWeight: overdue ? 700 : 500,
                color: overdue ? "var(--danger)" : "var(--text-tertiary)",
              }}>
                {new Date(task.dueDate).toLocaleDateString("ja-JP", { month: "short", day: "numeric", weekday: "short" }) + (task.dueTime ? " " + task.dueTime : "") + (overdue ? " 期限切れ" : "")}
              </span>
            )}
            {!task.dueDate && task.dueTime && (
              <span style={{ fontSize: sz.badgeFont, fontWeight: 500, color: "var(--text-tertiary)" }}>{task.dueTime}</span>
            )}
            {!isRepeat && priObj && priObj.key !== "none" && (
              <span style={{ fontSize: sz.badgeFont, fontWeight: 500, color: "var(--text-tertiary)", display: "inline-flex", alignItems: "center", gap: 4 }}>
                <span style={{ width: 7, height: 7, borderRadius: 4, backgroundColor: priObj.color, display: "inline-block" }} />
                {priObj.label}
              </span>
            )}
            {rl && (
              <span style={{ fontSize: sz.badgeFont, fontWeight: 500, color: "var(--text-tertiary)" }}>{"↻ " + rl}</span>
            )}
            {showTabName && task._tabName && (
              <span style={{ fontSize: sz.badgeFont, fontWeight: 500, color: "var(--text-tertiary)", display: "inline-flex", alignItems: "center", gap: 4 }}>
                <span style={{ width: 7, height: 7, borderRadius: 4, backgroundColor: ts.main, display: "inline-block" }} />
                {task._tabName}
              </span>
            )}
            {!task.done && progress > 0 && (
              <span style={{ fontSize: sz.badgeFont, fontWeight: 600, color: progress === 100 ? "#22A06B" : "var(--text-secondary)" }}>{progress}%</span>
            )}
            {task.notify && (
              <span style={{ fontSize: sz.badgeFont, fontWeight: 500, color: "var(--text-tertiary)" }}>🔔</span>
            )}
          </div>

          {!task.done && progress > 0 && (
            <div style={{ height: 3, borderRadius: 2, backgroundColor: "var(--bg-badge)", marginTop: 8, overflow: "hidden", maxWidth: 240 }}>
              <div style={{ height: "100%", width: progress + "%", backgroundColor: progress === 100 ? "#22A06B" : "var(--accent)", borderRadius: 2 }} />
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// 定時まとめの曜日選択チップ（最低1つは残す）
function WeekdayChips({ days, onChange }) {
  return (
    <div style={{ display: "flex", gap: 4, marginTop: 8 }}>
      {WEEKDAYS_JP.map((d, i) => {
        const sel = days.includes(i);
        return (
          <button key={i} onClick={() => {
            if (sel) {
              if (days.length === 1) return;
              onChange(days.filter(x => x !== i));
            } else {
              onChange([...days, i].sort((a, b) => a - b));
            }
          }} style={{
            flex: 1, padding: "6px 0", borderRadius: 8, border: "none", cursor: "pointer",
            fontSize: 12, fontWeight: 600, fontFamily: "inherit",
            backgroundColor: sel ? "var(--accent)" : "var(--bg-card)",
            color: sel ? "var(--accent-text)" : i === 0 ? "#EF4444" : i === 6 ? "#3B82F6" : "var(--text-secondary)",
          }}>{d}</button>
        );
      })}
    </div>
  );
}

      <div style={{ display: "flex", gap: 5 }}>

        <button onClick={() => setTask({ ...task, monthMode: "weekday", monthOrdinal: task.monthOrdinal || 1, monthWeekday: task.monthWeekday != null ? task.monthWeekday : 1 })} style={btnStyle(task.monthMode === "weekday")}>曜日</button>

            style={{ width: 60, padding: "8px 10px", borderRadius: 10, border: "1px solid var(--border)", backgroundColor: "var(--bg-card)", color: "var(--text-primary)", fontSize: 14, fontFamily: "inherit", outline: "none", textAlign: "center" }}
          />
          <span style={{ fontSize: 13, color: "var(--text-secondary)" }}>日</span>
        </div>
      ) : (
        <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>

            {WEEKDAYS_JP.map((d, i) => <option key={i} value={i}>{d}曜</option>)}
          </select>
        </div>
      )}
    </div>
  );

  if (r === "weekly") return <DayPicker />;
  if (r === "monthly") return <MonthPicker />;
  if (r !== "custom") return null;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <input type="number" min="1" max="99" value={task.customInterval || 1}
          onChange={e => setTask({ ...task, customInterval: Math.max(1, parseInt(e.target.value) || 1) })}
          style={{ width: 56, padding: "8px 10px", borderRadius: 10, border: "1px solid var(--border)", backgroundColor: "var(--bg-card)", color: "var(--text-primary)", fontSize: 14, fontFamily: "inherit", outline: "none", textAlign: "center" }}
        />

            <button key={u.key} onClick={() => setTask({ ...task, customUnit: u.key })} style={btnStyle((task.customUnit || "day") === u.key)}>{u.label}</button>
          ))}
        </div>
        <span style={{ fontSize: 13, color: "var(--text-secondary)" }}>ごと</span>
      </div>
      {(task.customUnit || "day") === "week" && <DayPicker />}
      {(task.customUnit || "day") === "month" && <MonthPicker />}
    </div>
  );
}

function TodoApp() {
  const { appData, updateData, loaded, syncNow, forcePull, lastSyncAt } = useStorage();
  const [online, setOnline] = useState(typeof navigator !== "undefined" ? navigator.onLine : true);
  const [nowTick, setNowTick] = useState(0);
  useEffect(() => {
    const on = () => setOnline(true);
    const off = () => setOnline(false);
    window.addEventListener("online", on);
    window.addEventListener("offline", off);
    const t = setInterval(() => setNowTick(n => n + 1), 30000);
    return () => {
      window.removeEventListener("online", on);
      window.removeEventListener("offline", off);
      clearInterval(t);
    };
  }, []);
  const tabs = appData.tabs || [];
  const countdowns = appData.countdowns || [];

  const setTabs = (newTabs) => updateData({ ...appData, tabs: newTabs });

  const [activeTabId, setActiveTabId] = useState(ALL_TAB);
  const [darkMode, setDarkMode] = useState(() => {
    try { return localStorage.getItem("todo-app-dark") === "1"; } catch (e) { return false; }
  });
  useEffect(() => {
    try { localStorage.setItem("todo-app-dark", darkMode ? "1" : "0"); } catch (e) {}
  }, [darkMode]);
  const [showAddTask, setShowAddTask] = useState(false);
  const [showAddTab, setShowAddTab] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [editingTask, setEditingTask] = useState(null);
  const [newTask, setNewTask] = useState({ ...emptyTask });
  const [newTabName, setNewTabName] = useState("");
  const [newTabColor, setNewTabColor] = useState(TAB_COLORS[0].value);
  const [delTabId, setDelTabId] = useState(null);
  const [editingTabId, setEditingTabId] = useState(null);
  const [editTabName, setEditTabName] = useState("");
  const [editTabColor, setEditTabColor] = useState("");
  const [editTabPinned, setEditTabPinned] = useState(false);
  const [editTabNotifyInclude, setEditTabNotifyInclude] = useState(true);
  const [sortKey, setSortKey] = useState("created");
  const [sortDir, setSortDir] = useState(SORT_DEFAULTS["created"]);
  const [addToTabId, setAddToTabId] = useState(null);
  const [movingTaskId, setMovingTaskId] = useState(null);
  const [confirmClearDone, setConfirmClearDone] = useState(false);
  const [dragTabId, setDragTabId] = useState(null);
  const [dragOverTabId, setDragOverTabId] = useState(null);
  const [dragTaskId, setDragTaskId] = useState(null);
  const [dragOverTaskId, setDragOverTaskId] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const [showCalc, setShowCalc] = useState(false);
  const [showSearch, setShowSearch] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const [undoData, setUndoData] = useState(null);
  const undoTimerRef = useRef(null);

  const [settingsNotify1Time, setSettingsNotify1Time] = useState("");
  const [settingsNotify1Enabled, setSettingsNotify1Enabled] = useState(false);
  const [settingsNotify2Time, setSettingsNotify2Time] = useState("");
  const [settingsNotify2Enabled, setSettingsNotify2Enabled] = useState(false);
  const [settingsNotify1Days, setSettingsNotify1Days] = useState([0, 1, 2, 3, 4, 5, 6]);
  const [settingsNotify2Days, setSettingsNotify2Days] = useState([0, 1, 2, 3, 4, 5, 6]);
  const [settingsSkipEmpty, setSettingsSkipEmpty] = useState(false);
  const [settingsSaved, setSettingsSaved] = useState(false);

  useEffect(() => {
    if (loaded) {
      const s = appData.settings || {};
      setSettingsNotify1Time(s.notify1Time || "");
      setSettingsNotify1Enabled(!!s.notify1Enabled);
      setSettingsNotify2Time(s.notify2Time || "");
      setSettingsNotify2Enabled(!!s.notify2Enabled);
      setSettingsNotify1Days(Array.isArray(s.notify1Days) && s.notify1Days.length ? s.notify1Days : [0, 1, 2, 3, 4, 5, 6]);
      setSettingsNotify2Days(Array.isArray(s.notify2Days) && s.notify2Days.length ? s.notify2Days : [0, 1, 2, 3, 4, 5, 6]);
      setSettingsSkipEmpty(!!s.skipEmptySummary);
    }
  }, [loaded]);

  const appDataRef = useRef(appData);
  useEffect(() => { appDataRef.current = appData; }, [appData]);
  useEffect(() => {
    if (!loaded) return;
    const check = () => {
      let next = resetRepeatTasks(appDataRef.current);
      next = autoCleanupDoneTasks(next);
      if (next !== appDataRef.current) {
        updateData(next);
        syncNow(next);
      }
    };
    check();
    const t = setInterval(check, 5 * 60 * 1000);
    const onFocus = () => check();
    window.addEventListener("focus", onFocus);
    return () => { clearInterval(t); window.removeEventListener("focus", onFocus); };
  }, [loaded]);

  const handleSaveNotifySettings = () => {
    const settings = {
      notify1Time: settingsNotify1Time,
      notify1Enabled: settingsNotify1Enabled,
      notify2Time: settingsNotify2Time,
      notify2Enabled: settingsNotify2Enabled,
      notify1Days: settingsNotify1Days,
      notify2Days: settingsNotify2Days,
      skipEmptySummary: settingsSkipEmpty,
    };
    const newData = {
      ...appData,
      settings: { ...(appData.settings || {}), ...settings },
    };
    updateData(newData);
    syncNow(newData);
    sendSaveSettingsToGAS(settings);
    setSettingsSaved(true);
    setTimeout(() => setSettingsSaved(false), 2000);
  };

  const handleUpdateCountdown = (cd) => {
    const newCds = countdowns.map(c => c.id === cd.id ? cd : c);
    const newData = { ...appData, countdowns: newCds };
    updateData(newData);
    syncNow(newData);
  };

  const moveTask = (taskId, toTabId) => {
    let movedTask = null;
    const newTabs = tabs.map(t => {
      const found = t.tasks.find(x => x.id === taskId);
      if (found) { movedTask = found; return { ...t, tasks: t.tasks.filter(x => x.id !== taskId) }; }
      return t;
    });
    if (movedTask) {
      setTabs(newTabs.map(t => t.id === toTabId ? { ...t, tasks: [...t.tasks, movedTask] } : t));
    }
    setMovingTaskId(null);
  };

  const handleTaskReorder = (fromId, toId) => {
    if (!fromId || !toId || fromId === toId) return;
    if (sortKey !== "order") {
      setSortKey("order");
      setSortDir(SORT_DEFAULTS["order"]);
    }
    setTabs(tabs.map(t => {
      const fromIdx = t.tasks.findIndex(x => x.id === fromId);
      const toIdx = t.tasks.findIndex(x => x.id === toId);
      if (fromIdx === -1 || toIdx === -1) return t;
      const newTasks = [...t.tasks];
      const [item] = newTasks.splice(fromIdx, 1);
      newTasks.splice(toIdx, 0, item);
      return { ...t, tasks: newTasks };
    }));
  };

  const isAllView = activeTabId === ALL_TAB;
  const isCountdownView = activeTabId === COUNTDOWN_TAB;
  const activeTab = tabs.find(t => t.id === activeTabId);

  const createTab = (name, color) => {
    const tab = { id: gid(), name: name, color: color || TAB_COLORS[0].value, tasks: [] };
    setTabs([...tabs, tab]);
    setActiveTabId(tab.id);
  };

  const addTab = () => {
    if (!newTabName.trim()) return;
    createTab(newTabName.trim(), newTabColor);
    setNewTabName("");
    setNewTabColor(TAB_COLORS[0].value);
    setShowAddTab(false);
  };

  const deleteTab = (id) => {
    const idx = tabs.findIndex(t => t.id === id);
    const removedTab = tabs[idx];
    const remaining = tabs.filter(t => t.id !== id);
    setTabs(remaining);
    if (activeTabId === id) setActiveTabId(ALL_TAB);
    setDelTabId(null);
    if (removedTab) {
      (removedTab.tasks || []).forEach(t => cancelNotifyOnGAS(t.id));
      const taskCount = (removedTab.tasks || []).length;
      showUndo(
        { type: "tab", tab: removedTab, index: idx },
        "タブ「" + removedTab.name + "」を削除" + (taskCount ? "（" + taskCount + "件）" : "")
      );
    }
  };

  const startEditTab = (tab) => {
    setEditingTabId(tab.id);
    setEditTabName(tab.name);
    setEditTabColor(tab.color || TAB_COLORS[0].value);
    setEditTabPinned(!!tab.pinned);
    setEditTabNotifyInclude(!tab.notifyExclude);
  };

  const commitEditTab = () => {
    if (editTabName.trim()) {
      setTabs(tabs.map(t => t.id === editingTabId
        ? { ...t, name: editTabName.trim(), color: editTabColor, pinned: editTabPinned, notifyExclude: !editTabNotifyInclude }
        : t
      ));
    }
    setEditingTabId(null);
  };

  const moveTab = (fromId, toId) => {
    const from = tabs.findIndex(t => t.id === fromId);
    const to = tabs.findIndex(t => t.id === toId);
    if (from < 0 || to < 0 || from === to) return;
    const arr = [...tabs];
    const [moved] = arr.splice(from, 1);
    arr.splice(to, 0, moved);
    setTabs(arr);
  };

  // 新規タスクの初期値（設定で通知デフォルトONにできる）
  const newEmptyTask = () => ({ ...emptyTask, notify: !!((appData.settings || {}).notifyDefaultOn) });

  const handleAddTask = () => {
    const targetTabId = isAllView ? addToTabId : activeTabId;
    if (!newTask.text.trim() || !targetTabId) return;
    const task = { id: gid(), ...newTask, text: newTask.text.trim(), done: false, createdAt: Date.now() };
    // 繰り返しタスクは次回発生日をdueDateに持たせる（通知予約と定時まとめに乗るように）
    if (task.repeat && task.repeat !== "none") task.dueDate = nextOccurrenceDateStr(task);
    const newTabs = tabs.map(t => t.id === targetTabId ? { ...t, tasks: [...t.tasks, task] } : t);
    const newData = { ...appData, tabs: newTabs };
    updateData(newData);
    syncNow(newData);
    sendNotifyToGAS(task);
    setNewTask(newEmptyTask());
    // 連続追加モード: モーダルを開いたまま次の入力へ
    if (!(appData.settings || {}).continuousAdd) {
      setShowAddTask(false);
      setAddToTabId(null);
    }
  };

  const updateTask = () => {
    if (!editingTask || !editingTask.text.trim()) return;
    const saved = { ...editingTask };
    const orig = tabs.flatMap(t => t.tasks).find(x => x.id === saved.id);
    // 繰り返しタスクは次回発生日をdueDateに持たせる。
    // ただし繰り返し設定・時刻が変わったときだけ再計算する（メモ編集等で期限切れ状態が消えないように）
    if (saved.repeat && saved.repeat !== "none") {
      const repeatChanged = !orig
        || orig.repeat !== saved.repeat
        || orig.dueTime !== saved.dueTime
        || JSON.stringify(orig.repeatDays || []) !== JSON.stringify(saved.repeatDays || [])
        || orig.repeatMonthDay !== saved.repeatMonthDay
        || orig.monthMode !== saved.monthMode
        || orig.monthOrdinal !== saved.monthOrdinal
        || orig.monthWeekday !== saved.monthWeekday
        || orig.customInterval !== saved.customInterval
        || orig.customUnit !== saved.customUnit;
      if (repeatChanged || !saved.dueDate) saved.dueDate = nextOccurrenceDateStr(saved);
    }
    // 期限が変わったら超過アラート済みマークをクリア（新しい期限で再度アラート可能に）
    if (orig && (orig.dueDate !== saved.dueDate || orig.dueTime !== saved.dueTime)) {
      delete saved.overdueAlerted;
    }
    const newTabs = tabs.map(t => ({
      ...t,
      tasks: t.tasks.map(x => x.id === saved.id ? { ...saved } : x),
    }));
    const newData = { ...appData, tabs: newTabs };
    updateData(newData);
    syncNow(newData);
    cancelNotifyOnGAS(saved.id);
    if (!saved.done) sendNotifyToGAS(saved);
    setEditingTask(null);
  };

  const toggleTask = (id) => {
    let toggled = null;
    const newTabs = tabs.map(t => ({
      ...t,
      tasks: t.tasks.map(x => {
        if (x.id === id) {
          const newDone = !x.done;
          const u = { ...x, done: newDone };
          u.completedAt = newDone ? Date.now() : null;
          if (x.repeat && x.repeat !== "none") {
            u.lastCompletedAt = newDone ? Date.now() : null;
          }
          toggled = u;
          return u;
        }
        return x;
      }),
    }));
    setTabs(newTabs);
    if (toggled) {
      if (toggled.done) cancelNotifyOnGAS(id);
      else sendNotifyToGAS(toggled);
    }
  };

  const showUndo = (payload, label) => {
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    setUndoData({ payload, label });
    undoTimerRef.current = setTimeout(() => {
      setUndoData(null);
      undoTimerRef.current = null;
    }, 5000);
  };

  const deleteTask = (id) => {
    let removedTask = null;
    let fromTabId = null;
    const newTabs = tabs.map(t => {
      const found = t.tasks.find(x => x.id === id);
      if (found) { removedTask = found; fromTabId = t.id; return { ...t, tasks: t.tasks.filter(x => x.id !== id) }; }
      return t;
    });
    setTabs(newTabs);
    cancelNotifyOnGAS(id);
    if (removedTask) {
      const name = removedTask.text.length > 16 ? removedTask.text.slice(0, 16) + "…" : removedTask.text;
      showUndo({ type: "task", task: removedTask, tabId: fromTabId }, "「" + name + "」を削除");
    }
  };

  const undoDelete = () => {
    if (!undoData) return;
    const p = undoData.payload;
    if (p.type === "task") {
      const targetTabId = tabs.find(t => t.id === p.tabId) ? p.tabId : (tabs[0] && tabs[0].id);
      if (targetTabId) {
        setTabs(tabs.map(t => t.id === targetTabId ? { ...t, tasks: [...t.tasks, p.task] } : t));
        if (!p.task.done) sendNotifyToGAS(p.task);
      }
    } else if (p.type === "tab") {
      const newTabs = [...tabs];
      newTabs.splice(Math.min(p.index, newTabs.length), 0, p.tab);
      setTabs(newTabs);
      (p.tab.tasks || []).forEach(t => { if (!t.done && t.notify) sendNotifyToGAS(t); });
    } else if (p.type === "tasks") {
      setTabs(tabs.map(t => {
        const addBack = p.items.filter(it => it.tabId === t.id).map(it => it.task);
        return addBack.length ? { ...t, tasks: [...t.tasks, ...addBack] } : t;
      }));
    }
    if (undoTimerRef.current) { clearTimeout(undoTimerRef.current); undoTimerRef.current = null; }
    setUndoData(null);
  };

  const clearDone = () => {
    const removed = [];
    const scopeCheck = (t) => isAllView || t.id === activeTabId;
    const newTabs = tabs.map(t => {
      if (!scopeCheck(t)) return t;
      // 繰り返しタスクは自動リセットで復活する前提のため削除対象外
      t.tasks.forEach(task => {
        if (task.done && (!task.repeat || task.repeat === "none")) removed.push({ task, tabId: t.id });
      });
      return { ...t, tasks: t.tasks.filter(x => !x.done || (x.repeat && x.repeat !== "none")) };
    });
    setTabs(newTabs);
    if (removed.length) {
      showUndo({ type: "tasks", items: removed }, "完了済み " + removed.length + "件を削除");
    }
  };

  const resetData = async () => {
    if (USER_ID) {
      try {
        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "resetData", userId: USER_ID }),
        });
      } catch (e) {}
    }
    try { localStorage.removeItem("todo-app-v6"); } catch (e) {}
    window.location.reload();
  };

  const allTasks = tabs.flatMap(t =>
    t.tasks.map(task => ({ ...task, _tabId: t.id, _tabName: t.name, _tabColor: t.color }))
  );

  const currentTasks = isAllView
    ? allTasks
    : (activeTab ? activeTab.tasks.map(t => ({ ...t, _tabId: activeTab.id, _tabColor: activeTab.color })) : []);

  const sorted = doSort(currentTasks, sortKey, sortDir);
  const doneCount = currentTasks.filter(t => t.done).length;
  const totalCount = currentTasks.length;

  // Ink Minimal: ほぼ無彩色。色は状態（期限切れ・優先度・タブ識別）にだけ使う
  const themeVars = {
    "--bg-main":     darkMode ? "#101013" : "#FFFFFF",
    "--bg-card":     darkMode ? "#151518" : "#FFFFFF",
    "--bg-header":   darkMode ? "#101013" : "#FFFFFF",
    "--bg-checkbox": darkMode ? "#2A2A30" : "#E9E9E7",
    "--bg-badge":    darkMode ? "#1D1D21" : "#F4F4F2",
    "--bg-input":    darkMode ? "#1D1D21" : "#F4F4F2",
    "--text-primary":   darkMode ? "#EDEDEF" : "#17171A",
    "--text-secondary": darkMode ? "#9A9AA1" : "#6E6E73",
    "--text-tertiary":  darkMode ? "#74747D" : "#9B9BA0",
    "--border":      darkMode ? "#26262B" : "#EBEBE9",
    "--row-border":  darkMode ? "#1E1E22" : "#F2F2F1",
    "--check-border": darkMode ? "#3D3D44" : "#D9D9D6",
    "--accent":      darkMode ? "#EDEDEF" : "#17171A",
    "--accent-text": darkMode ? "#101013" : "#FFFFFF",
    "--danger":      darkMode ? "#F2555A" : "#D93025",
    "--danger-bg":   darkMode ? "#3A1D1F" : "#FEF2F2",
    "--success":     "#22A06B",
    "--success-bg":  darkMode ? "#16301F" : "#DCFCE7",
    "--toast-action": darkMode ? "#2563EB" : "#7CB0FF",
    "--toggle-on":   "#22A06B",
    "--warn":        darkMode ? "#E8A33D" : "#B26A00",
    "--shadow":      darkMode ? "0 1px 2px rgba(0,0,0,0.4)" : "0 1px 2px rgba(20,20,20,0.04)",
  };

  if (!loaded) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", background: darkMode ? "#101013" : "#FFFFFF" }}>
        <div style={{ width: 32, height: 32, border: "3px solid " + (darkMode ? "#26262B" : "#E5E7EB"), borderTopColor: darkMode ? "#EDEDEF" : "#17171A", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
        <style>{"@keyframes spin { to { transform: rotate(360deg) } }"}</style>
      </div>
    );
  }

  return (
    <div style={{ ...themeVars, minHeight: "100vh", backgroundColor: "var(--bg-main)", fontFamily: "'Noto Sans JP','Hiragino Sans',sans-serif" }}>

      <div style={{ backgroundColor: "var(--bg-header)", borderBottom: "1px solid var(--border)", position: "sticky", top: 0, zIndex: 100 }}>
        <div style={{ padding: "16px 20px 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
            <h1 style={{ margin: 0, fontSize: 19, fontWeight: 800, letterSpacing: "-0.01em", color: "var(--text-primary)" }}>
              {new Date().toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" })}
            </h1>
            {USER_ID && (!online || lastSyncAt) && (
              <div style={{ fontSize: 11, color: "var(--text-tertiary)", fontWeight: 500 }}>
                {!online
                  ? <span style={{ color: "var(--danger)", fontWeight: 600 }}>オフライン</span>
                  : <span>保存済み {timeAgo(lastSyncAt)}</span>}
              </div>
            )}
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            {USER_ID && (
              <button
                onClick={async () => {
                  setSyncing(true);
                  await forcePull();
                  setSyncing(false);
                }}
                disabled={syncing}
                title="クラウドから再読み込み"
                style={{
                  width: 38, height: 38, borderRadius: 19, border: "none",
                  cursor: syncing ? "default" : "pointer",
                  backgroundColor: "transparent", color: "var(--text-secondary)",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  opacity: syncing ? 0.6 : 1,
                }}
              >
                <RefreshIcon spinning={syncing} />
              </button>
            )}
            <button onClick={() => { setShowSearch(true); setSearchQuery(""); }} title="検索" style={{ width: 38, height: 38, borderRadius: 19, border: "none", cursor: "pointer", backgroundColor: "transparent", color: "var(--text-secondary)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <SearchIcon />
            </button>
            <button onClick={() => setShowCalc(true)} title="日数計算" style={{ width: 38, height: 38, borderRadius: 19, border: "none", cursor: "pointer", backgroundColor: "transparent", color: "var(--text-secondary)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <CalcIcon />
            </button>
            <button onClick={() => setDarkMode(!darkMode)} style={{ width: 38, height: 38, borderRadius: 19, border: "none", cursor: "pointer", backgroundColor: "transparent", color: "var(--text-secondary)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              {darkMode ? <SunIcon /> : <MoonIcon />}
            </button>
            <button onClick={() => setShowSettings(true)} style={{ width: 38, height: 38, borderRadius: 19, border: "none", cursor: "pointer", backgroundColor: "transparent", color: "var(--text-secondary)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <GearIcon />
            </button>
          </div>
        </div>

        {tabs.length > 0 && (
          <div style={{ position: "relative" }}>
          <div
            id="tab-scroll-bar"
            style={{ display: "flex", alignItems: "center", padding: "12px 12px 0", overflowX: "auto", WebkitOverflowScrolling: "touch", WebkitMaskImage: "linear-gradient(to right, transparent 0, black 12px, black calc(100% - 24px), transparent 100%)", maskImage: "linear-gradient(to right, transparent 0, black 12px, black calc(100% - 24px), transparent 100%)" }}>

            {[...tabs.filter(t => t.pinned), ...tabs.filter(t => !t.pinned)].map(tab => {
              const isActive = tab.id === activeTabId;
              const undone = tab.tasks.filter(t => !t.done).length;
              const tabC = tab.color || "#64748B";
              const MAX_LEN = 4;
              const displayName = !isActive && tab.name.length > MAX_LEN
                ? tab.name.slice(0, MAX_LEN) + "…"
                : tab.name;
              const isDragging = dragTabId === tab.id;
              const isDragOver = dragOverTabId === tab.id && dragTabId !== tab.id;
              return (
                <div key={tab.id}
                  draggable
                  onDragStart={() => setDragTabId(tab.id)}
                  onDragOver={e => { e.preventDefault(); setDragOverTabId(tab.id); }}
                  onDrop={() => {
                    if (dragTabId && dragTabId !== tab.id) moveTab(dragTabId, tab.id);
                    setDragTabId(null); setDragOverTabId(null);
                  }}
                  onDragEnd={() => { setDragTabId(null); setDragOverTabId(null); }}
                  style={{
                    display: "flex", alignItems: "center",
                    opacity: isDragging ? 0.4 : 1,
                    borderLeft: isDragOver ? "2px solid " + tabC : "2px solid transparent",
                    transition: "opacity 0.15s, border 0.1s",
                  }}>
                  <button
                    onClick={() => setActiveTabId(tab.id)}
                    style={{
                      padding: "10px 13px", border: "none", cursor: "pointer",
                      fontSize: 13,
                      fontWeight: isActive ? 700 : 500, whiteSpace: "nowrap",
                      color: isActive ? "var(--text-primary)" : "var(--text-secondary)",
                      backgroundColor: "transparent",
                      borderBottom: isActive ? "2px solid var(--accent)" : "2px solid transparent",
                      fontFamily: "inherit", display: "flex", alignItems: "center", gap: 6,
                    }}>
                    {tab.pinned && <span style={{ fontSize: 9, opacity: 0.4 }}>📌</span>}
                    <span style={{ width: 6, height: 6, borderRadius: 3, backgroundColor: tabC, display: "inline-block", flexShrink: 0 }} />
                    {displayName}
                    {undone > 0 && (
                      <span style={{ fontSize: 11, fontWeight: 600, color: isActive ? "var(--text-secondary)" : "var(--text-tertiary)" }}>
                        {undone}
                      </span>
                    )}
                  </button>
                </div>
              );
            })}

            <button onClick={() => setActiveTabId(ALL_TAB)} style={{
              padding: "10px 13px", border: "none", cursor: "pointer", fontSize: 13,
              fontWeight: isAllView ? 700 : 500, whiteSpace: "nowrap",
              color: isAllView ? "var(--text-primary)" : "var(--text-secondary)",
              backgroundColor: "transparent",
              borderBottom: isAllView ? "2px solid var(--accent)" : "2px solid transparent",
              fontFamily: "inherit",
            }}>
              すべて
              {allTasks.filter(t => !t.done).length > 0 && (
                <span style={{ marginLeft: 6, fontSize: 11, fontWeight: 600, color: isAllView ? "var(--text-secondary)" : "var(--text-tertiary)", verticalAlign: "middle" }}>
                  {allTasks.filter(t => !t.done).length}
                </span>
              )}
            </button>

            {(() => {
              const isCdActive = activeTabId === COUNTDOWN_TAB;
              const nearest = countdowns
                .map(c => daysUntil(c.date))
                .filter(d => d >= 0)
                .sort((a, b) => a - b)[0];
              return (
                <button onClick={() => setActiveTabId(COUNTDOWN_TAB)} style={{
                  padding: "10px 13px", border: "none", cursor: "pointer",
                  fontSize: 13,
                  fontWeight: isCdActive ? 700 : 500, whiteSpace: "nowrap",
                  color: isCdActive ? "var(--text-primary)" : "var(--text-secondary)",
                  backgroundColor: "transparent",
                  borderBottom: isCdActive ? "2px solid var(--accent)" : "2px solid transparent",
                  fontFamily: "inherit", display: "flex", alignItems: "center", gap: 5,
                }}>
                  <span>📅</span>
                  {isCdActive && <span>カウントダウン</span>}
                  {nearest != null && (
                    <span style={{ fontSize: 11, fontWeight: 600, color: isCdActive ? "var(--text-secondary)" : "var(--text-tertiary)" }}>
                      {nearest === 0 ? "今日" : "あと" + nearest + "日"}
                    </span>
                  )}
                </button>
              );
            })()}

            <button onClick={() => setShowAddTab(true)} style={{
              width: 28, height: 28, minWidth: 28, borderRadius: 8,
              border: "2px dashed var(--border)", cursor: "pointer",
              backgroundColor: "transparent", color: "var(--text-tertiary)",
              fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center", marginLeft: 4,
            }}>+</button>
          </div>
          </div>
        )}
      </div>

      {tabs.length === 0 ? (
        <WelcomeScreen
          onCreateTab={createTab}
          onQuickAdd={() => {
            const defaultTab = { id: gid(), name: "タスク", color: TAB_COLORS[0].value, tasks: [] };
            setTabs([defaultTab]);
            setActiveTabId(ALL_TAB);
            setAddToTabId(defaultTab.id);
            setNewTask(newEmptyTask());
            setShowAddTask(true);
          }}
        />
      ) : activeTabId === COUNTDOWN_TAB ? (
        <CountdownPanel
          countdowns={countdowns}
          onAdd={(cd) => {
            const newCds = [...countdowns, cd];
            const newData = { ...appData, countdowns: newCds };
            updateData(newData);
            syncNow(newData);
          }}
          onDelete={(id) => {
            const newCds = countdowns.filter(c => c.id !== id);
            const newData = { ...appData, countdowns: newCds };
            updateData(newData);
            syncNow(newData);
          }}
          onUpdate={handleUpdateCountdown}
        />
      ) : (
        <div>
          <div style={{ padding: "12px 16px 100px", minHeight: "50vh" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12, padding: "0 4px", flexWrap: "wrap" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 4, marginRight: 4 }}>
                <span style={{ fontSize: 12, color: "var(--text-tertiary)", fontWeight: 600 }}>並べ替え</span>
                <button onClick={() => setSortDir(d => d === "asc" ? "desc" : "asc")} style={{
                  background: "none", border: "none", cursor: "pointer", padding: 2,
                  color: "var(--text-tertiary)", display: "flex", alignItems: "center",
                }}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    {sortDir === "asc"
                      ? <><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></>
                      : <><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></>
                    }
                  </svg>
                </button>
              </div>
              {SORT_OPTIONS.map(s => (
                <button key={s.key} onClick={() => {
                  setSortKey(s.key);
                  setSortDir(SORT_DEFAULTS[s.key]);
                }} style={{
                  padding: "4px 10px", borderRadius: 8, border: "none", cursor: "pointer",
                  fontSize: 12, fontWeight: 600, fontFamily: "inherit",
                  backgroundColor: sortKey === s.key ? ACCENT : "var(--bg-badge)",
                  color: sortKey === s.key ? "var(--accent-text)" : "var(--text-secondary)",
                }}>{s.label}</button>
              ))}
              {!isAllView && activeTab && (
                <button onClick={() => startEditTab(activeTab)} style={{
                  marginLeft: "auto", padding: "4px 10px", borderRadius: 8,
                  border: "1px solid var(--border)", cursor: "pointer",
                  fontSize: 13, fontWeight: 600, fontFamily: "inherit",
                  backgroundColor: "var(--bg-badge)", color: "var(--text-secondary)",
                  display: "flex", alignItems: "center", gap: 4,
                }}>

              return (
                <TaskItem

                  }}
                  onReorderDragEnd={() => { setDragTaskId(null); setDragOverTaskId(null); }}

                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-tertiary)", marginTop: 2 }}>
                  <span>小</span>
                  <button onClick={() => update(TASK_SIZE_DEFAULT)} style={{

                  >

                  </button>
                </div>
                {settingsNotify1Enabled && (
